version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'development'
        RAILS_SERVE_STATIC_FILES: 'false'
    tty: true
    stdin_open: true
    image: chatwoot:development
    env_file: .env

  rails:
    <<: *base
    working_dir: /app
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    ports:
      - "3026:3000"
    env_file: .env
    environment:
      - VITE_RUBY_HOST=vite
      - VITE_RUBY_PORT=3036
      - NODE_ENV=development
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=100
    entrypoint: ["/bin/sh", "docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    working_dir: /app
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  vite:
    <<: *base
    working_dir: /app
    build:
      context: .
      dockerfile: ./docker/dockerfiles/vite.Dockerfile
    image: chatwoot-vite:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - "3056:3036" # Vite dev server
    environment:
      - VITE_RUBY_HOST=0.0.0.0
      - VITE_RUBY_PORT=3036
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: ["/bin/sh", "docker/entrypoints/vite.sh"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: 'no'
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:alpine
    restart: 'no'
    command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-server --requirepass \"$REDIS_PASSWORD\"; else redis-server; fi"]
    env_file: .env
    volumes:
      - redis:/data/redis

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1146:1025"
      - "8146:8025"

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  cache:
  bundle:

# Reserva uma faixa exclusiva para esta instância local. Isso evita depender
# dos pools automáticos do Docker, que já estão ocupados por outros projetos.
networks:
  default:
    name: gopure_crm_20260918b_default
    ipam:
      config:
        - subnet: 10.246.124.0/24
