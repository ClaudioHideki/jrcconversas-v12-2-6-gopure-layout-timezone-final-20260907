name: Publicar imagem JRC Conversas no GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag da imagem Docker
        required: true
        default: 4.16.2-jrc-v12.2.6-gopure-20260907
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claudiohideki/jrcconversas-v12-2-6-gopure-layout-timezone-final-20260907

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Definir a tag da imagem
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')"

          if [ -z "$TAG" ]; then
            echo "Tag inválida." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagem: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v12.2.6
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false



