name: Publicar imagem JRC Conversas no GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag da imagem Docker
        required: true
        default: 4.16.2-gopure-nico-autonomia-20260919-r1

concurrency:
  group: ghcr-${{ github.repository }}-${{ inputs.image_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claudiohideki/jrcconversas-v12-2-6-gopure-layout-timezone-final-20260907
  APP_BUILD_SHA: 166c241927bdb316cf05ace70544b71a9fd06971

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/fix/nico-autonomia-workflow'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BUILD_SHA }}
          persist-credentials: false

      - name: Validar commit e tag da imagem
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$APP_BUILD_SHA" ]; then
            echo "::error::O checkout nao corresponde ao commit autorizado."
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag invalida; informe uma tag Docker sem alteracoes."
            exit 1
          fi

          echo "Commit da aplicacao: $APP_BUILD_SHA"
          echo "Imagem: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verificar que a tag ainda nao existe
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-ghcr-tag.sh" <<'BASH'
          set -euo pipefail
          token="$(curl --fail --silent --show-error --get \
            --user "$GHCR_USER:$GHCR_TOKEN" \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$IMAGE_NAME:pull" \
            "https://$REGISTRY/token" | jq -er '.token | select(type == "string" and length > 0)')"
          echo "::add-mask::$token"

          status="$(curl --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            --output "$RUNNER_TEMP/ghcr-manifest.json" \
            --write-out '%{http_code}' \
            "https://$REGISTRY/v2/$IMAGE_NAME/manifests/$IMAGE_TAG")"

          if [ "$status" = 404 ] && jq -e \
            '.errors | length > 0 and all(.[]; .code == "MANIFEST_UNKNOWN")' \
            "$RUNNER_TEMP/ghcr-manifest.json" > /dev/null; then
            echo "Tag ausente no GHCR: $IMAGE_TAG"
          else
            echo "::error::Tag existente ou consulta inconclusiva (HTTP $status). Publicacao bloqueada."
            exit 1
          fi
          BASH
          bash "$RUNNER_TEMP/check-ghcr-tag.sh"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir somente a aplicacao Rails
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ env.APP_BUILD_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Revalidar a tag e publicar
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/check-ghcr-tag.sh"
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          printf 'Commit da aplicacao: `%s`\n\nImagem publicada: `%s`\n' \
            "$APP_BUILD_SHA" "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
